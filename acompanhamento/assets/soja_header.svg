<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 202" preserveAspectRatio="xMaxYMid slice">
  <defs>
    <!-- folíolo (folha oval com nervura) -->
    <g id="foliolo">
      <path d="M0 0 C 14 -10, 40 -12, 58 0 C 40 12, 14 10, 0 0 Z"/>
      <path d="M2 0 L 54 0"/>
      <path d="M16 0 l 8 -6 M 28 0 l 8 -7 M 40 0 l 7 -5 M 16 0 l 8 6 M 28 0 l 8 7 M 40 0 l 7 5"/>
    </g>
    <!-- folha trifoliolada -->
    <g id="trifolio">
      <path d="M0 0 L 30 -6"/>
      <use href="#foliolo" transform="translate(30 -6) rotate(-10)"/>
      <use href="#foliolo" transform="translate(30 -6) rotate(-62) scale(.85)"/>
      <use href="#foliolo" transform="translate(30 -6) rotate(42) scale(.85)"/>
    </g>
    <!-- vagem -->
    <g id="vagem">
      <path d="M0 0 C 4 -6, 10 -6, 13 -2 C 16 -7, 22 -7, 25 -2 C 28 -7, 34 -6, 38 0 C 34 5, 6 6, 0 0 Z"/>
      <path d="M38 0 l 6 1"/>
    </g>
    <!-- planta de soja -->
    <g id="planta">
      <path d="M0 210 C 4 170, -6 140, 2 100 C 8 70, 0 40, 6 0"/>
      <use href="#trifolio" transform="translate(2 150) rotate(-30)"/>
      <use href="#trifolio" transform="translate(0 150) scale(-1 1) rotate(-20)"/>
      <use href="#trifolio" transform="translate(4 96) rotate(-38) scale(.95)"/>
      <use href="#trifolio" transform="translate(2 88) scale(-1 1) rotate(-34) scale(.9)"/>
      <use href="#trifolio" transform="translate(5 42) rotate(-52) scale(.8)"/>
      <use href="#trifolio" transform="translate(5 36) scale(-1 1) rotate(-48) scale(.75)"/>
      <use href="#vagem" transform="translate(3 176) rotate(-70) scale(.8)"/>
      <use href="#vagem" transform="translate(1 170) scale(-1 1) rotate(-75) scale(.75)"/>
      <use href="#vagem" transform="translate(4 124) rotate(-65) scale(.75)"/>
      <use href="#vagem" transform="translate(2 118) scale(-1 1) rotate(-70) scale(.7)"/>
      <use href="#vagem" transform="translate(5 66) rotate(-60) scale(.65)"/>
    </g>
  </defs>
  <g fill="none" stroke="#FFFFFF" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" opacity=".16">
    <use href="#planta" transform="translate(120 10) scale(.95)"/>
    <use href="#planta" transform="translate(250 -20) scale(1.1) rotate(4)"/>
    <use href="#planta" transform="translate(360 30) scale(.8) rotate(-6)"/>
    <use href="#planta" transform="translate(470 -10) scale(1.05)"/>
    <use href="#planta" transform="translate(585 20) scale(.9) rotate(5)"/>
    <use href="#planta" transform="translate(690 -30) scale(1.15) rotate(-3)"/>
    <use href="#planta" transform="translate(800 10) scale(.85)"/>
    <use href="#planta" transform="translate(905 -15) scale(1.05) rotate(6)"/>
  </g>
</svg>
