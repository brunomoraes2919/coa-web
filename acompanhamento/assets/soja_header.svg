<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 240" preserveAspectRatio="xMaxYMid slice">
  <!-- Ilustração em traço fino de pés de soja, só no lado direito da faixa (a página aplica o esmaecimento). -->
  <defs>
    <g id="foliolo">
      <path d="M0 0 C 14 -10, 40 -12, 58 0 C 40 12, 14 10, 0 0 Z"/>
      <path d="M3 0 L 52 0"/>
    </g>
    <g id="trifolio">
      <path d="M0 0 L 28 -6"/>
      <use href="#foliolo" transform="translate(28 -6) rotate(-12)"/>
      <use href="#foliolo" transform="translate(28 -6) rotate(-64) scale(.82)"/>
      <use href="#foliolo" transform="translate(28 -6) rotate(40) scale(.82)"/>
    </g>
    <g id="vagem">
      <path d="M0 0 C 4 -6, 10 -6, 13 -2 C 16 -7, 22 -7, 25 -2 C 28 -7, 34 -6, 38 0 C 34 5, 6 6, 0 0 Z"/>
    </g>
    <g id="planta">
      <path d="M0 250 C 4 200, -6 160, 2 110 C 8 76, 0 40, 6 0"/>
      <use href="#trifolio" transform="translate(2 168) rotate(-30)"/>
      <use href="#trifolio" transform="translate(0 168) scale(-1 1) rotate(-20)"/>
      <use href="#trifolio" transform="translate(4 106) rotate(-38) scale(.95)"/>
      <use href="#trifolio" transform="translate(2 98) scale(-1 1) rotate(-34) scale(.9)"/>
      <use href="#trifolio" transform="translate(5 44) rotate(-52) scale(.8)"/>
      <use href="#trifolio" transform="translate(5 38) scale(-1 1) rotate(-48) scale(.75)"/>
      <use href="#vagem" transform="translate(3 196) rotate(-70) scale(.8)"/>
      <use href="#vagem" transform="translate(1 190) scale(-1 1) rotate(-75) scale(.75)"/>
      <use href="#vagem" transform="translate(4 136) rotate(-65) scale(.75)"/>
      <use href="#vagem" transform="translate(2 128) scale(-1 1) rotate(-70) scale(.7)"/>
    </g>
  </defs>
  <g fill="none" stroke="#FFFFFF" stroke-width="1.15" stroke-linecap="round" stroke-linejoin="round">
    <use href="#planta" transform="translate(120 40) scale(.8) rotate(-4)"/>
    <use href="#planta" transform="translate(215 -6) scale(1) rotate(3)"/>
    <use href="#planta" transform="translate(318 26) scale(.88) rotate(-5)"/>
    <use href="#planta" transform="translate(420 -24) scale(1.12)"/>
    <use href="#planta" transform="translate(522 12) scale(.95) rotate(5)"/>
    <use href="#planta" transform="translate(612 -30) scale(1.15) rotate(-3)"/>
  </g>
</svg>
