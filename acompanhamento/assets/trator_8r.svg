<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 210" role="img" aria-label="Trator 8R com plantadeira">
  <defs>
    <linearGradient id="verde" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4F9E3C"/>
      <stop offset="0.55" stop-color="#367C2B"/>
      <stop offset="1" stop-color="#275E1F"/>
    </linearGradient>
    <linearGradient id="vidro" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#CFE3EA"/>
      <stop offset="0.5" stop-color="#8FB3C2"/>
      <stop offset="1" stop-color="#5E8494"/>
    </linearGradient>
    <radialGradient id="pneu" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0.72" stop-color="#2B2B2B"/>
      <stop offset="1" stop-color="#111"/>
    </radialGradient>
  </defs>

  <!-- sombra -->
  <ellipse cx="228" cy="196" rx="206" ry="7" fill="#000" opacity=".12"/>

  <!-- ===== Plantadeira ===== -->
  <!-- cabeçalho de engate -->
  <path d="M120 128 L196 140" stroke="#2A2A2A" stroke-width="6" stroke-linecap="round"/>
  <!-- barra porta-ferramentas -->
  <rect x="14" y="118" width="116" height="12" rx="3" fill="url(#verde)"/>
  <!-- caixas de semente -->
  <g>
    <path d="M20 84 h28 l-3 34 h-22 z" fill="url(#verde)"/>
    <rect x="18" y="80" width="32" height="7" rx="2" fill="#FFDE00"/>
    <path d="M58 84 h28 l-3 34 h-22 z" fill="url(#verde)"/>
    <rect x="56" y="80" width="32" height="7" rx="2" fill="#FFDE00"/>
    <path d="M96 84 h28 l-3 34 h-22 z" fill="url(#verde)"/>
    <rect x="94" y="80" width="32" height="7" rx="2" fill="#FFDE00"/>
  </g>
  <!-- linhas de plantio -->
  <g fill="#1E1E1E">
    <rect x="26" y="130" width="8" height="30"/><rect x="64" y="130" width="8" height="30"/><rect x="102" y="130" width="8" height="30"/>
  </g>
  <g fill="#2B2B2B" stroke="#555" stroke-width="2">
    <circle cx="30" cy="168" r="11"/><circle cx="68" cy="168" r="11"/><circle cx="106" cy="168" r="11"/>
  </g>
  <g fill="#FFDE00"><circle cx="30" cy="168" r="3.5"/><circle cx="68" cy="168" r="3.5"/><circle cx="106" cy="168" r="3.5"/></g>
  <!-- rodas de transporte -->
  <circle cx="84" cy="176" r="17" fill="url(#pneu)"/>
  <circle cx="84" cy="176" r="8" fill="#FFDE00"/>

  <!-- ===== Trator 8R ===== -->
  <!-- chassi -->
  <rect x="200" y="120" width="196" height="24" rx="4" fill="#1F1F1F"/>
  <!-- capô -->
  <path d="M258 92 L392 92 Q412 92 414 112 L416 136 L258 136 Z" fill="url(#verde)"/>
  <!-- faixa amarela do capô -->
  <path d="M262 106 L408 106" stroke="#FFDE00" stroke-width="4" stroke-linecap="round"/>
  <!-- grade frontal -->
  <path d="M402 96 Q413 98 414 112 L415 132 L404 132 Z" fill="#1B1B1B"/>
  <g stroke="#3A3A3A" stroke-width="1.4"><path d="M406 104 L413 104"/><path d="M406 110 L414 110"/><path d="M406 116 L414 116"/><path d="M406 122 L414 122"/><path d="M406 128 L414 128"/></g>
  <!-- lastros frontais -->
  <rect x="404" y="136" width="26" height="20" rx="3" fill="#1F1F1F"/>
  <g stroke="#3A3A3A" stroke-width="1.5"><path d="M410 137 L410 155"/><path d="M416 137 L416 155"/><path d="M422 137 L422 155"/></g>
  <!-- escapamento -->
  <rect x="272" y="50" width="7" height="44" rx="2" fill="#262626"/>
  <rect x="270" y="46" width="11" height="8" rx="2" fill="#1A1A1A"/>
  <!-- filtro/pré-limpador -->
  <rect x="288" y="80" width="12" height="13" rx="3" fill="#262626"/>

  <!-- cabine -->
  <path d="M176 118 L184 44 Q186 34 196 34 L256 34 Q266 34 267 44 L272 118 Z" fill="url(#verde)"/>
  <path d="M170 34 L272 34 Q278 34 278 28 L278 26 Q278 20 270 20 L178 20 Q168 20 168 28 Q168 34 170 34 Z" fill="#1E1E1E"/>
  <rect x="172" y="22" width="102" height="4" rx="2" fill="#367C2B"/>
  <!-- vidros -->
  <path d="M191 42 L253 42 Q259 42 259 48 L263 100 L186 100 Z" fill="url(#vidro)"/>
  <path d="M191 42 L213 42 L199 100 L186 100 Z" fill="#fff" opacity=".22"/>
  <path d="M224 42 L228 100" stroke="#1E1E1E" stroke-width="3"/>
  <!-- banco / volante (silhueta) -->
  <path d="M232 70 q8 -6 14 2 l2 22 h-18 z" fill="#2F3F45" opacity=".55"/>
  <!-- escada -->
  <g stroke="#1E1E1E" stroke-width="3" stroke-linecap="round"><path d="M268 118 L268 150"/><path d="M262 128 L274 128"/><path d="M262 140 L274 140"/></g>
  <!-- espelho -->
  <path d="M278 50 L292 44 L292 60" stroke="#1E1E1E" stroke-width="2.5" fill="none"/>
  <rect x="289" y="42" width="6" height="16" rx="2" fill="#1E1E1E"/>

  <!-- paralama traseiro -->
  <path d="M154 132 Q160 72 226 70 Q286 72 292 132 L278 132 Q272 88 226 86 Q176 88 168 132 Z" fill="url(#verde)"/>
  <!-- roda traseira -->
  <circle cx="224" cy="146" r="56" fill="url(#pneu)"/>
  <g stroke="#3C3C3C" stroke-width="5" stroke-dasharray="7 9" fill="none"><circle cx="224" cy="146" r="52"/></g>
  <circle cx="224" cy="146" r="33" fill="#FFDE00"/>
  <circle cx="224" cy="146" r="26" fill="#F2CC00"/>
  <g fill="#D4B200"><circle cx="224" cy="126" r="3"/><circle cx="241" cy="136" r="3"/><circle cx="241" cy="156" r="3"/><circle cx="224" cy="166" r="3"/><circle cx="207" cy="156" r="3"/><circle cx="207" cy="136" r="3"/></g>
  <circle cx="224" cy="146" r="11" fill="#2A2A2A"/>
  <circle cx="224" cy="146" r="5" fill="#FFDE00"/>

  <!-- roda dianteira -->
  <path d="M332 136 Q336 108 370 106 Q402 108 406 136 Z" fill="#1F1F1F"/>
  <circle cx="370" cy="158" r="38" fill="url(#pneu)"/>
  <g stroke="#3C3C3C" stroke-width="4" stroke-dasharray="6 8" fill="none"><circle cx="370" cy="158" r="35"/></g>
  <circle cx="370" cy="158" r="22" fill="#FFDE00"/>
  <circle cx="370" cy="158" r="16" fill="#F2CC00"/>
  <circle cx="370" cy="158" r="7" fill="#2A2A2A"/>
  <circle cx="370" cy="158" r="3" fill="#FFDE00"/>

  <!-- identificação -->
  <text x="296" y="128" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" fill="#FFDE00">8R</text>
</svg>
