<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chuva por talhão · COA</title>
<link rel="icon" href="../mapas/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="../assets/coa-loader.css?v=202610062300">
<link rel="stylesheet" href="estilo.css?v=202610281700">
<script src="../assets/uso.js?v=202610231500"></script>
<script src="../assets/lembrete-atualizar.js?v=202610232000"></script>
<script src="config.js?v=202610081500"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.3/dist/umd/supabase.js" integrity="sha384-BWcjm9OdFth9TbhCxZPdm+gAOUMAzQy9nmTs12ioXdCcbVnJaPMn+fMUoQCLt60R" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.1/dist/echarts.min.js" integrity="sha384-Mx5lkUEQPM1pOJCwFtUICyX45KNojXbkWdYhkKUKsbv391mavbfoAmONbzkgYPzR" crossorigin="anonymous"></script>
<script src="logica.js?v=202610131900"></script>
</head>
<body>
<div class="app" id="app">

  <!-- ============================ BARRA ============================ -->
  <header class="barra">
    <div class="marca">
      <span class="marca-titulo">Chuva por talhão</span>
      <span class="marca-sub">Chuva da ZEUS em cada talhão, a mesma base do relatório Power BI</span>
    </div>
    <div class="filtros">
      <label class="campo-select campo-unidade"><span>Fazenda</span><select id="sel-fazenda"></select></label>
      <label class="campo-select"><span>Período</span><select id="sel-periodo"></select></label>
      <label class="campo-select campo-data" hidden><span>De</span><input type="date" id="dt-de"></label>
      <label class="campo-select campo-data" hidden><span>Até</span><input type="date" id="dt-ate"></label>
      <div class="campo-select campo-chave" role="group" aria-label="Tabela" title="Por dia: uma linha por talhão em cada dia do período. Por mês: a chuva de cada talhão somada por mês. Nenhuma marcada: o acumulado do período. Vale para a tabela ao lado do mapa e para o Excel."><span>Tabela</span>
        <div class="chave-caixa">
          <label><input type="checkbox" id="chk-por-dia"> Por dia</label>
          <label><input type="checkbox" id="chk-por-mes"> Por mês</label>
        </div></div>
      <label class="campo-select" title="Quais limites de talhão desenhar: as áreas de uma safra, os talhões cadastrados na ZEUS (os que têm valor de chuva; só em algumas fazendas) ou todos os talhões da fazenda"><span>Limites</span><select id="sel-limites"></select></label>
    </div>
    <div class="barra-acoes">
      <span class="atualizado" id="atualizado" aria-live="polite"></span>
      <button class="botao-acao" id="btn-excel" type="button" title="Baixa em Excel a fazenda e o período da tela: a tabela dos talhões, o dia a dia e os pluviômetros">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v12M7 10l5 5 5-5"/><path d="M4 17v3h16v-3"/></svg><span>Exportar Excel</span>
      </button>
      <button class="botao-acao" id="btn-atualizar" type="button" title="Busca agora na ZEUS a chuva de cada talhão. Os dados só mudam quando alguém clica em Atualizar.">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12a9 9 0 0 1-15.5 6.2M3 12a9 9 0 0 1 15.5-6.2"/><path d="M18.5 2.5v3.6h-3.6M5.5 21.5v-3.6h3.6"/></svg><span>Atualizar</span>
      </button>
    </div>
    <nav class="abas" id="abas" role="tablist" aria-label="Telas da chuva por talhão">
      <button role="tab" data-vista="mapa" aria-selected="true">Mapa e tabela</button>
      <button role="tab" data-vista="diario" aria-selected="false">Dia a dia</button>
      <button role="tab" data-vista="pics" aria-selected="false"><img class="icone-pic" src="pluviometro.png?v=1" alt="">Pluviômetros <span class="conta" id="conta-pics"></span></button>
    </nav>
  </header>

  <p class="aviso" id="aviso" role="status" hidden></p>

  <!-- ============================ MAPA E TABELA ============================ -->
  <main class="vista" id="vista-mapa">
    <section class="resumo" id="resumo" aria-label="Resumo da fazenda no período"></section>

    <div class="dupla">
      <section class="cartao cartao-mapa">
        <header class="mapa-barra">
          <div class="segmentado" role="group" aria-label="O que o mapa pinta">
            <button type="button" data-modo="chuva" aria-pressed="true">Chuva no período</button>
            <button type="button" data-modo="seca" aria-pressed="false">Dias sem chuva</button>
          </div>
          <span class="periodo-texto" id="periodo-texto" title="Período das contas: termina no último dia com leitura da ZEUS"></span>
          <label class="chave"><input type="checkbox" id="chk-pics" checked><span><img class="icone-pic" src="pluviometro.png?v=1" alt="">Pluviômetros</span></label>
        </header>
        <div class="mapa-caixa" id="mapa-caixa">
          <svg id="mapa" role="img" aria-label="Mapa da fazenda com a chuva de cada talhão">
            <g id="g-talhoes"></g>
            <g id="g-linhas"></g>
            <g id="g-rotulos"></g>
            <g id="g-pics"></g>
          </svg>
          <div class="mapa-botoes">
            <button type="button" id="btn-mais" title="Aproximar" aria-label="Aproximar">+</button>
            <button type="button" id="btn-menos" title="Afastar" aria-label="Afastar">−</button>
            <button type="button" id="btn-fazenda" title="Ver a fazenda inteira" aria-label="Ver a fazenda inteira">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
            </button>
          </div>
          <div class="legenda" id="legenda"></div>
          <div class="dica" id="dica" hidden></div>
          <p class="mapa-vazio" id="mapa-vazio" hidden></p>
        </div>
      </section>

      <section class="cartao cartao-tabela">
        <div class="detalhe" id="detalhe" hidden></div>
        <header class="tabela-barra">
          <label class="busca"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
            <input type="search" id="busca" placeholder="Buscar talhão" aria-label="Buscar talhão"></label>
          <span class="tabela-conta" id="tabela-conta"></span>
        </header>
        <div class="tabela-rolagem" id="tab-talhoes"></div>
      </section>
    </div>
  </main>

  <!-- ============================ DIA A DIA ============================ -->
  <main class="vista" id="vista-diario" hidden>
    <div class="linha-opcoes">
      <p class="explica" id="explica-diario"></p>
      <div class="legenda solta" id="legenda-diario"></div>
    </div>
    <section class="cartao"><div class="tabela-rolagem grade-rolagem" id="tab-diario"></div></section>
  </main>

  <!-- ============================ PLUVIÔMETROS ============================ -->
  <main class="vista" id="vista-pics" hidden>
    <p class="explica" id="explica-pics"></p>
    <section class="cartao"><div class="tabela-rolagem" id="tab-pics"></div></section>
  </main>

</div>

<div class="coa-loader claro pequeno carregando" id="carregando" role="status" aria-live="polite"><div class="coa-loader-caixa"><div class="coa-loader-logo"><i class="coa-loader-brilho-fundo"></i><i class="coa-loader-parte risco"></i><i class="coa-loader-parte c"></i><i class="coa-loader-parte o"></i><i class="coa-loader-parte a"></i><i class="coa-loader-brilho"></i></div><p class="coa-loader-texto"><span id="carregando-texto">Carregando a chuva por talhão</span><i>.</i><i>.</i><i>.</i></p></div></div>
<script src="app.js?v=202610281700"></script>
</body>
</html>
