name: Sincronizar plantio PIMS

on:
  # Horário pausado: o Cloudflare do Agrovex barra os servidores do GitHub com uma página de verificação
  # (HTTP 403). Volte a ligar quando o Agrovex liberar a rota /mcp para chamadas com token:
  # schedule:
  #   - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: read

# uma rodada por vez: a limpeza por gerado_em de uma rodada não pode correr junto com o upsert da outra
concurrency:
  group: plantio-pims
  cancel-in-progress: false

jobs:
  sincronizar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      # Node 24 (o mesmo com que a rotina foi validada contra o Agrovex); o script não tem dependências
      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Verificar secrets
        env:
          AGROVEX_TOKEN: ${{ secrets.AGROVEX_TOKEN }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          faltando=""
          if [ -z "$AGROVEX_TOKEN" ]; then faltando="$faltando AGROVEX_TOKEN"; fi
          if [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then faltando="$faltando SUPABASE_SERVICE_ROLE_KEY"; fi
          if [ -n "$faltando" ]; then
            echo "::error::Secret(s) ausente(s) em Settings > Secrets and variables > Actions:$faltando"
            exit 1
          fi

      - name: Sincronizar plantio
        env:
          AGROVEX_TOKEN: ${{ secrets.AGROVEX_TOKEN }}
          SUPABASE_URL: https://pkaxbitsqxjxjlwnhjhd.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node modulos/mapas/scripts/sincronizar-plantio.mjs
